[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fulfillment-ops-copilot"
version = "0.1.0"
description = "Lean, memory-efficient RAG and Multi-Agent fulfillment pipeline"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Viresh Shah" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "google-genai",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "tenacity",
    "diskcache",
    "numpy"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

# FIX: Explicitly disable auto-discovery across your custom directories
[tool.setuptools]
packages = []
